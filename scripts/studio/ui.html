<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>镜间工作台 · 色卡质检台</title>
<style>
  :root { color-scheme: dark; --ink:#0d0f12; --panel:#171a1f; --line:#2a2d32; --paper:#f1ece2; --muted:#a9a7a2; --gold:#c69a5b; --red:#d1715f; --amber:#d8b26a; --green:#7fa87f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink); color: var(--paper); font: 14px/1.6 Inter, "Source Han Sans SC", "Microsoft YaHei", sans-serif; }
  a { color: var(--gold); }
  header { position: sticky; top: 0; z-index: 5; background: rgba(13,15,18,.94); border-bottom: 1px solid var(--line); padding: 14px 20px; backdrop-filter: blur(6px); }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .04em; }
  .kicker { font-size: 11px; letter-spacing: .22em; color: var(--gold); text-transform: uppercase; }
  .stats { display: flex; gap: 16px; margin-left: auto; font-size: 12px; color: var(--muted); }
  .stats b { color: var(--paper); font-weight: 600; }
  .stats .severe b { color: var(--red); } .stats .borderline b { color: var(--amber); } .stats .good b { color: var(--green); }
  .toolbar { margin-top: 12px; }
  button { font: inherit; font-size: 12px; color: var(--paper); background: var(--panel); border: 1px solid var(--line); padding: 6px 11px; cursor: pointer; transition: .15s; }
  button:hover { border-color: var(--gold); color: var(--gold); }
  button.active { border-color: var(--gold); background: var(--gold); color: var(--ink); }
  button[data-action="replace"]:hover, button[data-action="merge"]:hover { border-color: var(--green); color: var(--green); }
  button[data-action="intent"]:hover { border-color: var(--amber); color: var(--amber); }
  button.primary { background: var(--gold); border-color: var(--gold); color: var(--ink); font-weight: 600; }
  button.primary:hover { background: #d8ab6b; color: var(--ink); }
  main { padding: 18px 20px 120px; display: grid; gap: 14px; }
  .card { display: grid; grid-template-columns: 208px 1fr; gap: 16px; background: var(--panel); border: 1px solid var(--line); padding: 14px; }
  .card.done { border-color: #3d4b3d; }
  .card img { width: 100%; height: 117px; object-fit: cover; background: #0b0d10; display: block; }
  .meta { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .meta .slug { color: var(--muted); font-size: 11px; font-family: ui-monospace, Menlo, monospace; }
  .meta h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .meta .film { font-size: 12px; color: var(--muted); }
  .badge { font-size: 11px; border: 1px solid var(--line); padding: 1px 6px; color: var(--muted); }
  .badge.severe { border-color: var(--red); color: var(--red); }
  .badge.borderline { border-color: var(--amber); color: var(--amber); }
  .badge.good { border-color: var(--green); color: var(--green); }
  .badge.decision { border-color: var(--gold); color: var(--gold); }
  .swatch-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .swatch-row > span.label { width: 62px; flex: none; font-size: 11px; color: var(--muted); letter-spacing: .1em; }
  .swatches { display: flex; gap: 3px; flex-wrap: wrap; }
  .swatch { width: 46px; height: 30px; position: relative; border: 1px solid rgba(255,255,255,.08); font-size: 9px; font-family: ui-monospace, monospace; display: flex; align-items: flex-end; justify-content: center; }
  .swatch.off { outline: 1px dashed var(--red); outline-offset: 1px; }
  .swatch small { background: rgba(0,0,0,.55); color: #fff; padding: 0 2px; line-height: 12px; }
  .coverage { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
  .bar { flex: 1; height: 7px; background: #23262b; position: relative; }
  .bar i { position: absolute; inset: 0 auto 0 0; display: block; }
  .note { font-size: 11px; color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .empty { padding: 60px 0; text-align: center; color: var(--muted); }
  footer { position: fixed; inset: auto 0 0 0; background: rgba(13,15,18,.96); border-top: 1px solid var(--line); padding: 12px 20px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  #message { font-size: 12px; color: var(--gold); }
  code { font-family: ui-monospace, Menlo, monospace; color: var(--paper); background: #101317; padding: 1px 5px; }
</style>
</head>
<body>
<header>
  <div class="row">
    <div><p class="kicker">Jingjian Studio</p><h1>色卡质检台</h1></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="row toolbar">
    <button data-filter="all" class="active">全部</button>
    <button data-filter="severe">严重（&lt;30%）</button>
    <button data-filter="borderline">偏低（30–60%）</button>
    <button data-filter="pending">未处理</button>
    <button data-filter="decided">已决定</button>
    <button data-filter="film-default">电影级默认色卡</button>
    <span class="note" id="count"></span>
  </div>
</header>
<main id="list"><p class="empty">正在读取画面数据…</p></main>
<footer>
  <button class="primary" id="apply">生成回填文件</button>
  <button id="resetAll">清空所有决定</button>
  <span class="note">决定写入 <code>.studio/state.json</code>，回填写入 <code>lib/palette-overrides.ts</code>（构建时生效）</span>
  <span id="message"></span>
</footer>

<script>
const state = { frames: [], summary: {}, filter: "all" };
const list = document.getElementById("list");
const stats = document.getElementById("stats");
const count = document.getElementById("count");
const message = document.getElementById("message");

const percent = (value) => `${Math.round(value * 100)}%`;
const level = (coverage) => (coverage < 0.3 ? "severe" : coverage < 0.6 ? "borderline" : "good");
const inkFor = (hex) => {
  const channel = (value) => { const c = value / 255; return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
  const luma = 0.2126 * channel(parseInt(hex.slice(1, 3), 16)) + 0.7152 * channel(parseInt(hex.slice(3, 5), 16)) + 0.0722 * channel(parseInt(hex.slice(5, 7), 16));
  return luma > 0.24 ? "#15130f" : "#f4efe5";
};
const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[character]));

function swatchRow(label, colors, fit, showDelta) {
  const parts = colors.map((color) => {
    const entry = showDelta && fit ? fit.perColor.find((item) => item.color.toUpperCase() === color.toUpperCase()) : null;
    const off = entry && entry.deltaE >= 12;
    const hint = entry ? `<small>ΔE${entry.deltaE}</small>` : "";
    return `<span class="swatch${off ? " off" : ""}" style="background:${color};color:${inkFor(color)}" title="${color}${entry ? ` → 画面里最接近 ${entry.hex}（ΔE ${entry.deltaE}）` : ""}">${hint}</span>`;
  }).join("");
  return `<div class="swatch-row"><span class="label">${label}</span><div class="swatches">${parts}</div></div>`;
}

function measuredRow(tone) {
  const parts = tone.dominants.slice(0, 6).map((dominant) => `<span class="swatch" style="background:${dominant.hex};color:${inkFor(dominant.hex)}" title="${dominant.hex} 占 ${dominant.share}%"><small>${dominant.share}%</small></span>`).join("");
  const bands = tone.bands.map((band) => `<span class="swatch" style="background:${band.hex || "transparent"};border-style:${band.hex ? "solid" : "dashed"}" title="${band.key} ${band.share}% ${band.hex || "（此档无影调）"}"></span>`).join("");
  return `<div class="swatch-row"><span class="label">实测主色</span><div class="swatches">${parts}</div></div>
          <div class="swatch-row"><span class="label">曝光阶梯</span><div class="swatches">${bands}</div></div>`;
}

function card(frame) {
  const fit = frame.fit ?? { coverage: 1, worst: 0 };
  const palette = frame.decision?.palette?.length ? frame.decision.palette : frame.palette;
  const decisionLabel = frame.decision ? { replace: "已决定 · 采用实测", merge: "已决定 · 补全", intent: "已决定 · 刻意偏离" }[frame.decision.mode] : null;
  return `<article class="card${frame.decision ? " done" : ""}" data-slug="${frame.slug}">
    <a href="${frame.preview}" target="_blank" rel="noreferrer"><img src="${frame.thumbnail}" alt="${escapeHtml(frame.title)}" loading="lazy"></a>
    <div>
      <div class="meta">
        <h2>${escapeHtml(frame.title)}</h2>
        <span class="film">${escapeHtml(frame.filmTitle)}</span>
        <span class="slug">${frame.slug}</span>
        <span class="badge ${level(fit.coverage)}">吻合 ${percent(fit.coverage)}</span>
        <span class="badge">ΔE最差 ${Math.round(fit.worst)}</span>
        <span class="badge">${frame.paletteScope}</span>
        ${frame.paletteSource === "override" ? '<span class="badge good">已回填</span>' : ""}
        ${decisionLabel ? `<span class="badge decision">${decisionLabel}</span>` : ""}
      </div>
      ${swatchRow("当前色卡", palette, fit, true)}
      ${measuredRow(frame.tone)}
      <div class="coverage"><div class="bar"><i style="width:${Math.max(2, fit.coverage * 100)}%;background:var(${level(fit.coverage) === "severe" ? "--red" : level(fit.coverage) === "borderline" ? "--amber" : "--green"})"></i></div>
        <span class="note">画面像素被色卡覆盖 ${percent(fit.coverage)}；实测平均明度 ${frame.tone.stats.luma}%、饱和 ${frame.tone.stats.saturation}%</span></div>
      <div class="actions">
        <button data-action="replace" data-slug="${frame.slug}">采用实测 ${frame.suggestions?.replace?.length ?? 0} 色</button>
        <button data-action="merge" data-slug="${frame.slug}">补全至 ${frame.suggestions?.merge?.length ?? 0} 色</button>
        <button data-action="intent" data-slug="${frame.slug}">标记刻意偏离</button>
        ${frame.decision ? `<button data-action="reset" data-slug="${frame.slug}">撤销</button>` : ""}
        <span class="note">建议：${fit.coverage < 0.3 ? "采用实测" : fit.coverage < 0.6 ? "补全或抽查" : "无需处理"}</span>
      </div>
    </div>
  </article>`;
}

function visible() {
  const filter = state.filter;
  return state.frames.filter((frame) => {
    const coverage = frame.fit?.coverage ?? 1;
    if (filter === "severe") return coverage < 0.3;
    if (filter === "borderline") return coverage >= 0.3 && coverage < 0.6;
    if (filter === "pending") return !frame.decision;
    if (filter === "decided") return Boolean(frame.decision);
    if (filter === "film-default") return frame.paletteSource === "film-default";
    return true;
  }).sort((a, b) => (a.fit?.coverage ?? 1) - (b.fit?.coverage ?? 1) || (b.fit?.worst ?? 0) - (a.fit?.worst ?? 0));
}

function render() {
  const rows = visible();
  count.textContent = `显示 ${rows.length} / ${state.frames.length} 帧`;
  list.innerHTML = rows.length ? rows.map(card).join("") : '<p class="empty">该筛选下没有画面</p>';
}

function renderStats() {
  const s = state.summary;
  stats.innerHTML = `<span class="severe">严重 <b>${s.severe}</b></span><span class="borderline">偏低 <b>${s.borderline}</b></span><span class="good">良好 <b>${s.good}</b></span><span>电影级默认色卡 <b>${s.filmDefaults}</b></span><span>已回填 <b>${s.overridden}</b></span><span>已决定 <b>${s.decided}</b></span>`;
}

async function load() {
  const payload = await (await fetch("/api/frames")).json();
  state.frames = payload.frames;
  state.summary = payload.summary;
  renderStats();
  render();
}

list.addEventListener("click", async (event) => {
  const button = event.target.closest("button[data-action]");
  if (!button) return;
  const { action, slug } = button.dataset;
  button.disabled = true;
  const payload = await (await fetch("/api/decision", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ slug, mode: action }) })).json();
  const frame = state.frames.find((item) => item.slug === slug);
  frame.decision = payload.decision;
  frame.palette = payload.palette;
  frame.fit = payload.fit;
  frame.paletteSource = payload.decision ? "override" : frame.originalSource ?? frame.paletteSource;
  state.summary = payload.summary;
  renderStats();
  render();
  message.textContent = `${slug} → ${{ replace: "采用实测", merge: "补全", intent: "标记刻意偏离", reset: "撤销" }[action]}，吻合度 ${percent(payload.fit.coverage)}`;
});

document.querySelectorAll("button[data-filter]").forEach((button) => button.addEventListener("click", () => {
  document.querySelectorAll("button[data-filter]").forEach((other) => other.classList.remove("active"));
  button.classList.add("active");
  state.filter = button.dataset.filter;
  render();
}));

document.getElementById("apply").addEventListener("click", async () => {
  const payload = await (await fetch("/api/apply", { method: "POST" })).json();
  message.textContent = payload.error ? payload.error : `已写入 ${payload.file} · ${payload.count} 帧（${payload.note}）→ 运行 npm run build 后提交`;
});

document.getElementById("resetAll").addEventListener("click", async () => {
  if (!confirm("清空所有决定并重置 lib/palette-overrides.ts？")) return;
  await fetch("/api/reset-decisions", { method: "POST" });
  message.textContent = "已清空决定与回填文件";
  await load();
});

load();
</script>
</body>
</html>
